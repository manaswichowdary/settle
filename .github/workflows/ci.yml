name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Let Testcontainers talk to the newer Docker on the runner
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - run: mvn -B verify
