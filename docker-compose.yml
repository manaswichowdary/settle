# Postgres, a single Kafka broker, one API (which also runs the outbox relay) and three workers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: settle
      POSTGRES_USER: settle
      POSTGRES_PASSWORD: settle
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settle -d settle"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  api:
    build: .
    image: settle:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/settle
      KAFKA_BOOTSTRAP: kafka:9092
      SETTLE_RELAY_ENABLED: "true"
      SETTLE_CONSUMER_ENABLED: "false"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  worker:
    build: .
    image: settle:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/settle
      KAFKA_BOOTSTRAP: kafka:9092
      SETTLE_RELAY_ENABLED: "false"
      SETTLE_CONSUMER_ENABLED: "true"
      SERVER_PORT: "8081"
    deploy:
      replicas: 3
    depends_on:
      api: { condition: service_started }
